<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<div class="tx-dlf-default-viewer-shell">
    <div class="main-wrapper tx-dlf-default-viewer-viewframe">
        <aside class="control-bar tx-dlf-default-viewer-control-bar">
            <div class="header-bar tx-dlf-default-viewer-header-bar">
                <div class="brand tx-dlf-default-viewer-brand">
                    <f:link.page pageUid="{rootPid}" title="Kitodo Presentation">Kitodo Presentation</f:link.page>
                </div>
            </div>

            <f:link.page pageUid="{rootPid}" class="step-back-button tx-dlf-default-viewer-back-link">Back</f:link.page>

            <div class="ctrldata-container tx-dlf-default-viewer-ctrldata-container">
                <section class="metadata-wrapper tx-dlf-default-viewer-control-panel tx-dlf-default-viewer-control-panel-metadata">
                    <div class="tx-dlf-metadata tx-dlf-default-viewer-metadata">
                        <div class="tx-dlf-default-viewer-control-header">
                            <p class="tx-dlf-default-viewer-panel-kicker">Document</p>
                            <h2>Metadata</h2>
                        </div>
                        <f:cObject typoscriptObjectPath="plugin.tx_dlf_metadata" />
                    </div>
                    <button type="button" class="offcanvas-toggle tx-dlf-default-viewer-offcanvas-toggle" aria-label="Toggle metadata"></button>
                </section>

                <section class="toc-wrapper tx-dlf-default-viewer-control-panel tx-dlf-default-viewer-control-panel-toc">
                    <div class="tx-dlf-default-viewer-control-header">
                        <p class="tx-dlf-default-viewer-panel-kicker">Structure</p>
                        <h2>Contents</h2>
                    </div>
                    <f:cObject typoscriptObjectPath="plugin.tx_dlf_tableofcontents" />
                    <button type="button" class="offcanvas-toggle tx-dlf-default-viewer-offcanvas-toggle" aria-label="Toggle contents"></button>
                </section>
            </div>
        </aside>

        <main class="tx-dlf-default-viewer-main">
            <div class="document-view tx-dlf-default-viewer-document-view">
                <f:if condition="{documentId}">
                    <f:then>
                        <f:cObject typoscriptObjectPath="plugin.tx_dlf_pageview" />
                    </f:then>
                    <f:else>
                        <div class="tx-dlf-default-viewer-empty-state">
                            <div class="tx-dlf-default-viewer-empty-notice">
                                <p class="tx-dlf-default-viewer-kicker">No Document</p>
                                <h2>No document selected</h2>
                                <p>Pass a document URL in <code>tx_dlf[id]</code> to open a METS or IIIF document.</p>
                            </div>
                        </div>
                    </f:else>
                </f:if>

                <div class="document-functions tx-dlf-default-viewer-document-functions">
                    <div class="provider tx-dlf-default-viewer-provider">
                        <div>
                            <p class="tx-dlf-default-viewer-kicker">Kitodo Presentation</p>
                            <h1>Viewer</h1>
                        </div>
                    </div>

                    <div class="view-functions tx-dlf-default-viewer-view-functions">
                        <ul>
                            <f:cObject typoscriptObjectPath="lib.tx_dlf_default_viewer.navigation.viewfunction" />
                            <f:cObject typoscriptObjectPath="plugin.tx_dlf_imagemanipulationtool" />
                        </ul>
                    </div>
                </div>

                <div class="page-control tx-dlf-default-viewer-page-control">
                    <f:cObject typoscriptObjectPath="lib.tx_dlf_default_viewer.navigation.pagecontrol" />
                </div>
            </div>
        </main>
    </div>

    <script>
        (function () {
            function updateViewerSize() {
                if (window.tx_dlf_viewer && typeof window.tx_dlf_viewer.updateLayerSize === 'function') {
                    window.setTimeout(function () { window.tx_dlf_viewer.updateLayerSize(); }, 0);
                    window.setTimeout(function () { window.tx_dlf_viewer.updateLayerSize(); }, 250);
                }
            }

            function enterFullscreen() {
                document.body.classList.add('fullscreen');
                var button = document.querySelector('li.tx-dlf-tools-fullscreen a');
                if (button) {
                    button.classList.add('active');
                }
                updateViewerSize();
            }

            function exitFullscreen() {
                document.body.classList.remove('fullscreen');
                var button = document.querySelector('li.tx-dlf-tools-fullscreen a');
                if (button) {
                    button.classList.remove('active');
                }
                updateViewerSize();
            }

            function toggleFullscreen(event) {
                event.preventDefault();
                if (document.body.classList.contains('fullscreen')) {
                    exitFullscreen();
                } else {
                    enterFullscreen();
                }
            }

            function setExpanded(panel, expanded) {
                var toggle = panel.querySelector('.tx-dlf-default-viewer-offcanvas-toggle');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                }
            }

            function closeSiblingPanels(panel) {
                var panels = document.querySelectorAll('.metadata-wrapper.open, .toc-wrapper.open');
                Array.prototype.forEach.call(panels, function (openPanel) {
                    if (openPanel !== panel) {
                        openPanel.classList.remove('open');
                        setExpanded(openPanel, false);
                    }
                });
            }

            function togglePanel(event) {
                event.preventDefault();
                var panel = event.currentTarget.closest('.metadata-wrapper, .toc-wrapper');
                if (!panel) {
                    return;
                }
                var expanded = !panel.classList.contains('open');
                closeSiblingPanels(panel);
                panel.classList.toggle('open', expanded);
                setExpanded(panel, expanded);
                updateViewerSize();
            }

            window.addEventListener('load', function () {
                updateViewerSize();

                var fullscreenButton = document.querySelector('li.tx-dlf-tools-fullscreen a');
                if (fullscreenButton) {
                    fullscreenButton.addEventListener('click', toggleFullscreen);
                    fullscreenButton.addEventListener('touchstart', toggleFullscreen, { passive: false });
                }

                var panelToggles = document.querySelectorAll('.tx-dlf-default-viewer-offcanvas-toggle');
                Array.prototype.forEach.call(panelToggles, function (toggle) {
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.addEventListener('click', togglePanel);
                    toggle.addEventListener('touchstart', togglePanel, { passive: false });
                });
            });
        })();
    </script>
</div>
</html>
